services:
  postgres:
    image: postgres:16-alpine
    container_name: satmat-postgres
    restart: unless-stopped
    profiles: ["local"]
    environment:
      POSTGRES_USER: satmat
      POSTGRES_PASSWORD: satmat
      POSTGRES_DB: satmat
    ports:
      - "5432:5432"
    volumes:
      - satmat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satmat -d satmat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: satmat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - satmat-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: satmat-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Single DB: Supabase is the source of truth. .env provides
      # DATABASE_URL (pooler 6543) + DIRECT_URL (direct 5432).
      # Local postgres service above is OPTIONAL fallback for offline dev
      # — enable with: docker compose --profile local up
      # Do NOT hardcode DATABASE_URL here or it overrides Supabase .env.
      REDIS_URL: redis://redis:6379
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||8080)+'/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  satmat-pgdata:
  satmat-redis: